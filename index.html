<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOM Stress-Tester</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      min-height: 100dvh; /* Mengikuti tinggi layar HP sebenarnya */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }
    .card {
      background: #131d31;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    h1 {
      font-size: 16px;
      color: #38bdf8;
      font-weight: 700;
    }
    .badge {
      font-size: 10px;
      background: #1e293b;
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }
    select, input[type="file"] {
      width: 100%;
      height: 40px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #090d16;
      border: 1px solid #334155;
      color: #fff;
      font-size: 13px;
    }
    /* Grid 2 Kolom untuk Menghemat Ruang Layar */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .source-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
    }
    .src-btn {
      flex: 1;
      height: 28px;
      background: #090d16;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .src-btn.active {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .btn-prepare {
      background: #2563eb;
      color: white;
      border: none;
      height: 44px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-prepare:active { background: #1d4ed8; }
    #metrics {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      color: #38bdf8;
      background: #090d16;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      line-height: 1.4;
      min-height: 38px;
    }
    /* Kotak Frame Sandboxed */
    #sandbox-wrapper {
      border: 1.5px dashed #334155;
      border-radius: 10px;
      padding: 6px;
      background: #06090f;
      height: 125px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>⚡ DOM Stress-Tester</h1>
      <span class="badge">1-Screen All-in-One</span>
    </div>

    <!-- 1. Sumber File -->
    <div class="field">
      <div class="source-tabs">
        <button class="src-btn active" id="btnRepo" onclick="setSource('repo')">📁 Auto Repo</button>
        <button class="src-btn" id="btnManual" onclick="setSource('manual')">📤 Upload HP</button>
      </div>
      <div id="repoBox">
        <select id="repoFileSelect">
          <option value="">🔄 Memindai repo...</option>
        </select>
      </div>
      <div id="uploadBox" style="display: none;">
        <input type="file" id="localFile">
      </div>
    </div>

    <!-- 2. Grid Format & Multiplier (Berdampingan) -->
    <div class="grid-2">
      <div class="field">
        <label>Format Target:</label>
        <select id="mimeSelect">
          <option value="txt|text/plain">.TXT (Plain)</option>
          <option value="js|application/javascript">.JS (Script)</option>
          <option value="json|application/json">.JSON (Data)</option>
          <option value="html|text/html">.HTML (Doc)</option>
          <option value="bin|application/octet-stream">.BIN (Binary)</option>
          <option value="wasm|application/wasm">.WASM</option>
          <option value="dat|">.DAT (No MIME)</option>
          <option value="custom|application/x-custom" selected>.CUSTOM</option>
        </select>
      </div>

      <div class="field">
        <label>Multiplier Beban:</label>
        <select id="multiplier">
          <option value="1">1x (Asli)</option>
          <option value="10">10x Beban</option>
          <option value="50" selected>50x (Tinggi)</option>
          <option value="100">100x (Ekstrem)</option>
        </select>
      </div>
    </div>

    <!-- 3. Tingkat Keamanan -->
    <div class="field">
      <label>Mode Keamanan:</label>
      <select id="secLevel">
        <option value="standard">🟢 Standar (Open DOM)</option>
        <option value="strict">🟡 Ketat (Closed DOM + RAM Flush)</option>
        <option value="super-strict" selected>🔴 Super Ketat (CSP Lockdown + SHA-256)</option>
      </select>
    </div>

    <!-- Tombol Utama untuk Memasang Tombol Unduh -->
    <button class="btn-prepare" id="btnPrepare" onclick="prepareDOM()">
      ⚡ Siapkan ke Lapisan DOM
    </button>

    <div id="metrics">Pilih file lalu klik "Siapkan ke Lapisan DOM".</div>

    <!-- Area Lapisan Sandboxed (Tombol Unduh Muncul Di Sini) -->
    <div id="sandbox-wrapper">
      <iframe id="sandboxFrame" sandbox="allow-scripts allow-downloads"></iframe>
    </div>
  </div>

  <script>
    let currentSource = 'repo';
    const ALL_FORMATS = [
      { ext: 'txt', mime: 'text/plain' },
      { ext: 'js', mime: 'application/javascript' },
      { ext: 'json', mime: 'application/json' },
      { ext: 'html', mime: 'text/html' },
      { ext: 'bin', mime: 'application/octet-stream' },
      { ext: 'wasm', mime: 'application/wasm' },
      { ext: 'dat', mime: '' },
      { ext: 'custom', mime: 'application/x-custom' }
    ];

    function setSource(src) {
      currentSource = src;
      document.getElementById('btnRepo').classList.toggle('active', src === 'repo');
      document.getElementById('btnManual').classList.toggle('active', src === 'manual');
      document.getElementById('repoBox').style.display = src === 'repo' ? 'block' : 'none';
      document.getElementById('uploadBox').style.display = src === 'manual' ? 'block' : 'none';
    }

    // Auto-scan file dari repo GitHub
    async function scanRepo() {
      const sel = document.getElementById('repoFileSelect');
      let owner = 'ary05171', repo = 'download-test-blob';
      const hp = window.location.hostname.split('.');
      if (hp.length >= 3 && hp[1] === 'github' && hp[2] === 'io') {
        owner = hp[0];
        const pp = window.location.pathname.split('/').filter(Boolean);
        if (pp.length > 0) repo = pp[0];
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
        if (!res.ok) throw new Error();
        const files = (await res.json()).filter(f => f.type === 'file' && f.name !== 'index.html');
        sel.innerHTML = '';
        files.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.name;
          opt.textContent = `📄 ${f.name} (${(f.size/1024).toFixed(1)} KB)`;
          sel.appendChild(opt);
        });
      } catch (e) {
        sel.innerHTML = '<option value="area_config.json">📄 area_config.json</option>';
      }
    }
    scanRepo();

    async function getSHA256(buf) {
      const h = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Eksekusi Pemasangan ke DOM Iframe
    async function prepareDOM() {
      const metrics = document.getElementById('metrics');
      const iframe = document.getElementById('sandboxFrame');
      metrics.innerHTML = `⏳ Mengambil file & menyiapkan buffer...`;

      let arrayBuffer, baseName = "";
      try {
        if (currentSource === 'repo') {
          baseName = document.getElementById('repoFileSelect').value || 'area_config.json';
          const r = await fetch('./' + baseName);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          arrayBuffer = await r.arrayBuffer();
        } else {
          const f = document.getElementById('localFile').files[0];
          if (!f) throw new Error("Pilih file lokal terlebih dahulu!");
          baseName = f.name;
          arrayBuffer = await f.arrayBuffer();
        }
      } catch (err) {
        metrics.innerHTML = `❌ Error: ${err.message}`;
        return;
      }

      const multiplier = parseInt(document.getElementById('multiplier').value, 10);
      const secLevel = document.getElementById('secLevel').value;
      const [selExt, selMime] = document.getElementById('mimeSelect').value.split('|');
      const totalBytes = arrayBuffer.byteLength * multiplier;

      let hash = "N/A";
      if (secLevel === 'super-strict') {
        metrics.innerHTML = `🔐 Mengkalkulasi Checksum SHA-256...`;
        hash = await getSHA256(arrayBuffer);
      }

      const csp = (secLevel === 'super-strict')
        ? `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; blob:;">`
        : ``;

      const shadowMode = (secLevel === 'standard') ? 'open' : 'closed';

      // HTML di dalam Iframe (Tombol Unduh Hijau & Kuning)
      const frameHTML = `
        <!DOCTYPE html>
        <html>
        <head>
          ${csp}
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            body { margin: 0; background: transparent; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden; }
          </style>
        </head>
        <body>
          <div id="mount-point"></div>
          <script>
            window.addEventListener('message', (ev) => {
              if (ev.data.type === 'START') initIsolatedDOM(ev.data);
            });

            function initIsolatedDOM(data) {
              const { buffer, baseName, multiplier, totalSize, secLevel, selExt, selMime, allFormats } = data;
              const host = document.getElementById('mount-point');
              const shadow = host.attachShadow({ mode: '${shadowMode}' });

              const wrap = document.createElement('div');
              wrap.innerHTML = \`
                <style>
                  .box { display: flex; flex-direction: column; gap: 6px; }
                  .btn-run {
                    background: #10b981; color: #042f2e; border: none;
                    height: 38px; border-radius: 8px; font-weight: 800;
                    font-size: 13px; cursor: pointer; width: 100%;
                  }
                  .btn-run:active { background: #059669; }
                  .btn-batch {
                    background: #f59e0b; color: #451a03; border: none;
                    height: 38px; border-radius: 8px; font-weight: 800;
                    font-size: 12px; cursor: pointer; width: 100%;
                  }
                  .btn-batch:active { background: #d97706; }
                  .status-lbl { font-size: 10px; color: #94a3b8; text-align: center; font-family: monospace; }
                </style>
                <div class="box">
                  <button class="btn-run" id="btnSingle">💾 Unduh Satuan (.\${selExt})</button>
                  <button class="btn-batch" id="btnBatch">🔥 Unduh Semua Format (Batch)</button>
                  <div class="status-lbl" id="statusLbl">Buffer Siap: \${(totalSize/(1024*1024)).toFixed(2)} MB</div>
                </div>
              \`;
              shadow.appendChild(wrap);

              const statusLbl = shadow.getElementById('statusLbl');

              function buildStreamBlob(mime) {
                let count = 0;
                const stream = new ReadableStream({
                  start(controller) {
                    function push() {
                      if (count < multiplier) {
                        controller.enqueue(new Uint8Array(buffer));
                        count++;
                        push();
                      } else {
                        controller.close();
                      }
                    }
                    push();
                  }
                });
                return new Response(stream).blob();
              }

              function triggerDownload(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 100);
              }

              // Unduh Satuan
              shadow.getElementById('btnSingle').addEventListener('click', async () => {
                const t0 = performance.now();
                statusLbl.innerText = "Streaming...";
                const blob = await buildStreamBlob(selMime);
                triggerDownload(blob, "test_" + baseName + "." + selExt);
                const dur = ((performance.now() - t0)/1000).toFixed(2);
                statusLbl.innerText = \`Selesai: \${dur}s\`;
                window.parent.postMessage({ type: 'DONE', count: 1, dur }, '*');
              });

              // Batch Unduh Seluruh Ekstensi
              shadow.getElementById('btnBatch').addEventListener('click', async () => {
                const t0 = performance.now();
                for (let i = 0; i < allFormats.length; i++) {
                  const fmt = allFormats[i];
                  statusLbl.innerText = \`Unduh [\${i+1}/\${allFormats.length}]: .\${fmt.ext}\`;
                  const blob = await buildStreamBlob(fmt.mime);
                  triggerDownload(blob, "batch_" + i + "_" + baseName + "." + fmt.ext);
                  await new Promise(r => setTimeout(r, 220));
                }
                const dur = ((performance.now() - t0)/1000).toFixed(2);
                statusLbl.innerText = \`Batch Berhasil: \${dur}s\`;
                window.parent.postMessage({ type: 'DONE', count: allFormats.length, dur }, '*');
              });
            }
          <\/script>
        </body>
        </html>
      `;

      iframe.srcdoc = frameHTML;
      iframe.onload = () => {
        iframe.contentWindow.postMessage({
          type: 'START',
          buffer: arrayBuffer,
          baseName,
          multiplier,
          totalSize: totalBytes,
          secLevel,
          selExt,
          selMime,
          allFormats: ALL_FORMATS
        }, '*');

        metrics.innerHTML = `✅ <b>DOM Siap:</b> <code>${baseName}</code> (~${(totalBytes/(1024*1024)).toFixed(2)} MB)<br>` +
          `• Format: <b>.${selExt}</b> | Mode: <b>${secLevel.toUpperCase()}</b>`;
      };
    }

    window.addEventListener('message', (ev) => {
      if (ev.data.type === 'DONE') {
        const metrics = document.getElementById('metrics');
        metrics.innerHTML = `🏁 <b>Hasil Pengujian:</b><br>` +
          `• File Terunduh: <b>${ev.data.count} File</b><br>` +
          `• Total Waktu: <b>${ev.data.dur} detik</b>`;
      }
    });
  </script>
</body>
</html>
