<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Stress-Test Download & Sandboxed Multi-DOM</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #94a3b8;
    }
    input[type="file"], select, input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    #metrics {
      margin-top: 15px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      min-height: 48px;
    }
    /* Kontainer Iframe Sandboxed */
    #sandbox-wrapper {
      margin-top: 20px;
      border: 1px dashed #64748b;
      border-radius: 8px;
      padding: 10px;
      background: #090d16;
    }
    iframe {
      width: 100%;
      height: 120px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🧪 Stress-Test Download & Sandboxed DOM</h2>
    <p style="font-size: 13px; color: #94a3b8;">
      Menguji kekuatan buffer unduhan browser dari file lokal melalui lapisan enkapsulasi ganda (Iframe Sandbox + Shadow DOM).
    </p>

    <div class="form-group">
      <label>1. Pilih File Target (Bisa TXT, ZIP, Gambar, dll):</label>
      <input type="file" id="fileInput">
    </div>

    <div class="form-group">
      <label>2. Multiplier Beban (Stress Multiplier):</label>
      <select id="multiplier">
        <option value="1">1x (Ukuran Asli)</option>
        <option value="5">5x Beban (Duplikasi Stream)</option>
        <option value="20">20x Beban (Stress-Test)</option>
        <option value="50">50x Beban (Heavy Stress-Test)</option>
      </select>
    </div>

    <button id="btnPrepare">⚡ Siapkan ke Lapisan Multi-DOM</button>

    <div id="metrics">Status: Siap menerima file.</div>

    <!-- Lapisan Pengetatan: Wadah Iframe Sandbox -->
    <div id="sandbox-wrapper">
      <label style="color: #e2e8f0; margin-bottom: 8px;">
        🛡️ Lapisan Pengetatan DOM (Sandboxed Iframe & Closed Shadow-DOM):
      </label>
      <iframe id="sandboxIframe" sandbox="allow-scripts allow-downloads"></iframe>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const multiplierSelect = document.getElementById('multiplier');
    const btnPrepare = document.getElementById('btnPrepare');
    const metrics = document.getElementById('metrics');
    const iframe = document.getElementById('sandboxIframe');

    btnPrepare.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert("Pilih file terlebih dahulu!");
        return;
      }

      const multiplier = parseInt(multiplierSelect.value, 10);
      const estTotalSizeMB = ((file.size * multiplier) / (1024 * 1024)).toFixed(2);
      
      metrics.innerHTML = `Membaca file... Target simulasi: <b>${estTotalSizeMB} MB</b>`;

      // 1. Baca isi file ke ArrayBuffer
      const arrayBuffer = await file.arrayBuffer();
      
      // 2. Buat skrip yang akan diinjeksi ke dalam Sandboxed IFrame
      // Di dalam Iframe, kita bungkus lagi logika unduhannya ke dalam SHADOW DOM
      const sandboxedHTML = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>body { margin: 0; background: transparent; }</style>
        </head>
        <body>
          <div id="host-component"></div>

          <script>
            // Lapisan 1: Ambil data payload dari window induk
            window.addEventListener('message', (event) => {
              if (event.data.type === 'START_DOWNLOAD') {
                const { fileBuffer, filename, multiplier, totalExpectedSize } = event.data;
                mountShadowDOM(fileBuffer, filename, multiplier, totalExpectedSize);
              }
            });

            // Lapisan 2: Multi-inside DOM menggunakan "Closed" Shadow Root
            function mountShadowDOM(buffer, originalName, multiplier, totalSize) {
              const host = document.getElementById('host-component');
              const shadow = host.attachShadow({ mode: 'closed' });

              const container = document.createElement('div');
              container.innerHTML = \`
                <style>
                  .box { 
                    padding: 10px; 
                    background: #111827; 
                    border: 1px solid #374151; 
                    border-radius: 6px; 
                    text-align: center;
                  }
                  .btn-dl { 
                    background: #10b981; 
                    color: #fff; 
                    padding: 8px 16px; 
                    border: none; 
                    border-radius: 4px; 
                    cursor: pointer;
                    font-weight: bold;
                  }
                  .btn-dl:hover { background: #059669; }
                </style>
                <div class="box">
                  <button class="btn-dl" id="dlBtn">💾 Unduh via Multi-Layer Buffer</button>
                  <div id="status" style="color: #9ca3af; font-size: 11px; margin-top: 5px;">
                    Siap streaming: \${(totalSize / (1024*1024)).toFixed(2)} MB
                  </div>
                </div>
              \`;
              shadow.appendChild(container);

              const dlBtn = shadow.getElementById('dlBtn');
              const status = shadow.getElementById('status');

              dlBtn.addEventListener('click', () => {
                const startTime = performance.now();
                status.innerText = "Membuat ReadableStream buffer...";

                // Menggunakan ReadableStream untuk stress test streaming memori
                let count = 0;
                const stream = new ReadableStream({
                  start(controller) {
                    function push() {
                      if (count < multiplier) {
                        controller.enqueue(new Uint8Array(buffer));
                        count++;
                        push();
                      } else {
                        controller.close();
                      }
                    }
                    push();
                  }
                });

                // Bungkus Stream ke Response -> Blob
                new Response(stream).blob().then(blob => {
                  const blobUrl = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = blobUrl;
                  a.download = "stressed_" + originalName;
                  a.click();
                  
                  URL.revokeObjectURL(blobUrl);

                  const durationSec = ((performance.now() - startTime) / 1000).toFixed(2);
                  const speedMBps = ((totalSize / (1024 * 1024)) / durationSec).toFixed(2);

                  status.innerText = \`Selesai: \${durationSec}s (~ \${speedMBps} MB/s)\`;
                  
                  // Kirim metriks kembali ke Host
                  window.parent.postMessage({
                    type: 'METRICS',
                    duration: durationSec,
                    speed: speedMBps
                  }, '*');
                });
              });
            }
          <\/script>
        </body>
        </html>
      `;

      // Muat HTML ke iframe sandbox
      iframe.srcdoc = sandboxedHTML;

      // Tunggu hingga iframe selesai render, lalu kirimkan payload data
      iframe.onload = () => {
        iframe.contentWindow.postMessage({
          type: 'START_DOWNLOAD',
          fileBuffer: arrayBuffer,
          filename: file.name,
          multiplier: multiplier,
          totalExpectedSize: file.size * multiplier
        }, '*');

        metrics.innerHTML = `✅ Komponen terisolasi dalam <b>Iframe Sandbox + Closed Shadow DOM</b>. Klik tombol di dalam kotak hijau untuk eksekusi stress test!`;
      };
    });

    // Menerima laporan performa dari lapisan terdalam
    window.addEventListener('message', (e) => {
      if (e.data.type === 'METRICS') {
        metrics.innerHTML = `🏁 <b>Hasil Pengetasan:</b> Waktu Proses: <b>${e.data.duration} detik</b> | Kecepatan Alir Memori: <b>${e.data.speed} MB/s</b>`;
      }
    });
  </script>
</body>
</html>
