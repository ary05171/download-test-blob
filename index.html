<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini & AI Studio Engine Simulator</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #f1f5f9;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 10px;
    }
    .card {
      background: #0d0f12;
      border: 1px solid #23272f;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #23272f;
      padding-bottom: 8px;
    }
    h1 { font-size: 15px; color: #38bdf8; font-weight: 700; }
    .badge { font-size: 10px; background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 6px; }
    
    /* Code Box Gaya Gemini */
    .gemini-box {
      background: #060709;
      border: 1px solid #1c2029;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .gemini-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      font-family: monospace;
    }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    /* Pilihan Uji Simulator */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-test {
      height: 44px;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      text-align: center;
      color: #fff;
    }
    .btn-test span { font-size: 9px; opacity: 0.8; font-weight: normal; }
    
    .btn-red { background: #dc2626; }    /* Instant Revoke (0-Byte Test) */
    .btn-orange { background: #ea580c; } /* Async Gesture Expiry */
    .btn-purple { background: #9333ea; } /* Detached DOM Anchor */
    .btn-blue { background: #2563eb; }   /* Synthetic Dispatch Event */

    /* Terminal Monitor */
    .terminal {
      background: #040507;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      color: #38bdf8;
      height: 110px;
      overflow-y: auto;
      line-height: 1.4;
    }
    iframe { width: 100%; height: 75px; border: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>🧪 Gemini / AI Studio Simulator</h1>
      <span class="badge">Extreme Stress Suite</span>
    </div>

    <!-- PREVIEW BOX PERSIS GEMINI CHAT -->
    <div class="gemini-box">
      <div class="gemini-bar">
        <span>plaintext (auto-generated)</span>
        <button class="icon-btn" onclick="testGeminiExact()">⬇ Unduh Gaya Asli Gemini</button>
      </div>
      <div style="font-family: monospace; font-size: 10px; color: #a5b4fc;" id="txtPreview">
        // Payload teks disiapkan: Memuat...
      </div>
    </div>

    <div style="font-size: 11px; color: #94a3b8; font-weight: bold;">
      Pilih Skenario Kegagalan Browser untuk Diuji:
    </div>

    <!-- 4 SKENARIO UTAMA PENYEBAB BROWSER KUSTOM CRASH/GAGAL -->
    <div class="btn-grid">
      <!-- Skenario 1 -->
      <button class="btn-test btn-red" onclick="testInstantRevoke()">
        1. Instant Revoke
        <span>Tes Berkas 0-Byte (0ms Del)</span>
      </button>

      <!-- Skenario 2 -->
      <button class="btn-test btn-orange" onclick="testAsyncExpiry()">
        2. Async Gesture
        <span>Hilang Transient Token</span>
      </button>

      <!-- Skenario 3 -->
      <button class="btn-test btn-purple" onclick="testDetachedDOM()">
        3. Detached Anchor
        <span>Tanpa appendChild(a)</span>
      </button>

      <!-- Skenario 4 -->
      <button class="btn-test btn-blue" onclick="testSyntheticEvent()">
        4. Synthetic Event
        <span>Dispatch MouseEvent</span>
      </button>
    </div>

    <!-- FRAME SANDBOX DENGAN PENGETATAN DOM -->
    <div style="background:#090d16; border: 1px dashed #334155; border-radius: 8px; padding: 4px;">
      <iframe id="testFrame" sandbox="allow-scripts allow-downloads"></iframe>
    </div>

    <!-- LOG DIAGNOSTIK UNTUK PENGEMBANG BROWSER -->
    <div class="terminal" id="termLog">
      [READY] Menunggu pengujian skenario...
    </div>
  </div>

  <script>
    let sampleText = "INI ADALAH DATA MENTAH DARI GOOGLE AI STUDIO / GEMINI.\n" +
                     "Dibuat untuk menguji apakah browser mampu menangkap Blob secara instan.\n" +
                     "Timestamp: " + new Date().toISOString();

    document.getElementById('txtPreview').innerText = sampleText.substring(0, 95) + "...";

    function log(msg) {
      const term = document.getElementById('termLog');
      term.innerHTML = `> [${new Date().toLocaleTimeString()}] ${msg}<br>` + term.innerHTML;
    }

    // SKENARIO ASLI GEMINI (Gabungan Instant Revoke + Plaintext Blob)
    function testGeminiExact() {
      log("⚡ Menjalankan alur persis Google Gemini...");
      const blob = new Blob([sampleText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "gemini_code_" + Date.now() + ".txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      // Gemini langsung mencabut memori:
      URL.revokeObjectURL(url);
      log("⚠️ URL.revokeObjectURL langsung dipanggil 0ms! Cek apakah file 0-byte?");
    }

    // 1. UJI INSTANT REVOKE (Penyebab berkas 0-byte di WebView)
    function testInstantRevoke() {
      log("🔴 UJI 1: Instant Revoke dipicu.");
      const blob = new Blob([sampleText], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "test_0byte_check.bin";
      a.click();
      URL.revokeObjectURL(url); // Langsung hangus!
      log("🚨 Jika browser Anda mengunduh 0-byte, berarti engine Anda terlambat membaca memori.");
    }

    // 2. UJI ASYNC GESTURE EXPIRY
    async function testAsyncExpiry() {
      log("🟠 UJI 2: Menunggu Promise 300ms (Simulasi parsing Gemini)...");
      await new Promise(r => setTimeout(r, 300)); // Delay menghilangkan User-Gesture
      const blob = new Blob([sampleText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "test_async_token.txt";
      a.click();
      log("⚠️ Download dipicu setelah async. Cek apakah WebView memblokirnya!");
    }

    // 3. UJI DETACHED ANCHOR
    function testDetachedDOM() {
      log("🟣 UJI 3: Memicu klik pada tag <a> yang TIDAK ditempel ke DOM.");
      const blob = new Blob([sampleText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "test_detached_node.txt";
      // TIDAK ADA document.body.appendChild(a)
      a.click();
      log("⚠️ a.click() dipanggil tanpa berada di dalam hirarki DOM.");
    }

    // 4. UJI SYNTHETIC MOUSE EVENT
    function testSyntheticEvent() {
      log("🔵 UJI 4: Memicu via dispatchEvent(new MouseEvent('click')).");
      const blob = new Blob([sampleText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "test_synthetic_event.txt";
      const evt = new MouseEvent('click', { bubbles: true, cancelable: true, view: window });
      a.dispatchEvent(evt);
      log("⚠️ Event sintetik ditembakkan.");
    }
  </script>
</body>
</html>
