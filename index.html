<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Viewport diatur optimal agar pas di layar HP tanpa mengecil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stress-Test Download & Sandboxed DOM</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .card {
      background: #131d31;
      padding: 22px 18px;
      border-radius: 18px;
      width: 100%;
      max-width: 540px;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 8px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #cbd5e1;
    }
    input[type="file"], select {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #090d16;
      border: 1.5px solid #334155;
      color: #fff;
      font-size: 16px; /* 16px mencegah auto-zoom di iOS */
    }
    /* Toggle Mode Super Ketat */
    .toggle-container {
      background: #090d16;
      border: 1.5px solid #3b82f6;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .toggle-label {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      margin: 0;
    }
    .toggle-sub {
      font-size: 12px;
      color: #38bdf8;
      display: block;
      margin-top: 2px;
    }
    input[type="checkbox"] {
      width: 26px;
      height: 26px;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .btn-main {
      background: #2563eb;
      color: white;
      border: none;
      min-height: 54px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-main:active {
      transform: scale(0.98);
      background: #1d4ed8;
    }
    #metrics {
      margin-top: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #38bdf8;
      background: #090d16;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      line-height: 1.6;
      word-break: break-all;
    }
    /* Wadah Multi-DOM */
    #sandbox-wrapper {
      margin-top: 20px;
      border: 2px dashed #334155;
      border-radius: 14px;
      padding: 14px;
      background: #06090f;
    }
    .sandbox-header {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    iframe {
      width: 100%;
      height: 160px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚡ Stress-Test & Multi-DOM</h2>
    <div class="desc">
      Pengujian throughput unduhan file lokal dengan isolasi ganda (Sandboxed Iframe & Closed Shadow-DOM).
    </div>

    <div class="form-group">
      <label>1. Pilih File Target:</label>
      <input type="file" id="fileInput">
    </div>

    <div class="form-group">
      <label>2. Multiplier Beban (Stress Scale):</label>
      <select id="multiplier">
        <option value="1">1x (Ukuran Asli)</option>
        <option value="5">5x Beban (Duplikasi Memori)</option>
        <option value="20">20x Beban (Uji Berat)</option>
        <option value="50" selected>50x Beban (Extreme Stress)</option>
      </select>
    </div>

    <!-- Toggle Pengetatan Super -->
    <div class="toggle-container">
      <div>
        <label class="toggle-label" for="strictMode">🛡️ Mode Super Ketat</label>
        <span class="toggle-sub">Strict CSP + SHA-256 Checksum</span>
      </div>
      <input type="checkbox" id="strictMode" checked>
    </div>

    <button class="btn-main" id="btnPrepare">⚡ Siapkan ke Lapisan DOM</button>

    <div id="metrics">Status: Menunggu file dipilih...</div>

    <!-- Area Lapisan Multi-DOM -->
    <div id="sandbox-wrapper">
      <div class="sandbox-header">
        🔒 Lapisan Terisolasi (Sandboxed Frame):
      </div>
      <iframe id="sandboxIframe" sandbox="allow-scripts allow-downloads"></iframe>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const multiplierSelect = document.getElementById('multiplier');
    const strictModeCheckbox = document.getElementById('strictMode');
    const btnPrepare = document.getElementById('btnPrepare');
    const metrics = document.getElementById('metrics');
    const iframe = document.getElementById('sandboxIframe');

    // Fungsi utilitas untuk menghitung SHA-256 (Web Crypto API)
    async function calculateSHA256(buffer) {
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    btnPrepare.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert("Pilih file terlebih dahulu!");
        return;
      }

      const multiplier = parseInt(multiplierSelect.value, 10);
      const isStrict = strictModeCheckbox.checked;
      const totalBytes = file.size * multiplier;
      const estTotalMB = (totalBytes / (1024 * 1024)).toFixed(2);

      metrics.innerHTML = `⏳ Membaca payload... Target ukuran: <b>${estTotalMB} MB</b>`;

      const arrayBuffer = await file.arrayBuffer();
      
      let fileHash = "Dinonaktifkan";
      if (isStrict) {
        metrics.innerHTML = `🔐 Menghitung Checksum SHA-256 file asal...`;
        fileHash = await calculateSHA256(arrayBuffer);
      }

      // Meta CSP Super Ketat (Hanya diaktifkan jika mode super ketat dicentang)
      const cspMetaTag = isStrict 
        ? `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; blob:;">`
        : ``;

      const sandboxedHTML = `
        <!DOCTYPE html>
        <html>
        <head>
          ${cspMetaTag}
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            body { margin: 0; background: transparent; font-family: sans-serif; }
          </style>
        </head>
        <body>
          <div id="host-element"></div>

          <script>
            window.addEventListener('message', (event) => {
              if (event.data.type === 'MOUNT') {
                const { buffer, name, multiplier, totalSize, isStrict, origHash } = event.data;
                initClosedShadowDOM(buffer, name, multiplier, totalSize, isStrict, origHash);
              }
            });

            function initClosedShadowDOM(buffer, filename, multiplier, totalSize, isStrict, origHash) {
              const host = document.getElementById('host-element');
              // Enkapsulasi Tertutup
              const shadow = host.attachShadow({ mode: 'closed' });

              const wrapper = document.createElement('div');
              wrapper.innerHTML = \`
                <style>
                  .box {
                    background: #111827;
                    border: 1.5px solid #10b981;
                    padding: 16px;
                    border-radius: 12px;
                    text-align: center;
                  }
                  .btn-dl {
                    background: #10b981;
                    color: #062419;
                    width: 100%;
                    min-height: 48px;
                    border: none;
                    border-radius: 10px;
                    font-size: 15px;
                    font-weight: 800;
                    cursor: pointer;
                  }
                  .btn-dl:active { background: #059669; }
                  .status {
                    color: #94a3b8;
                    font-size: 12px;
                    margin-top: 8px;
                    font-family: monospace;
                  }
                </style>
                <div class="box">
                  <button class="btn-dl" id="execBtn">💾 Unduh Payload (Multi-DOM)</button>
                  <div class="status" id="statusText">Siap Stream: \${(totalSize / (1024*1024)).toFixed(2)} MB</div>
                </div>
              \`;
              shadow.appendChild(wrapper);

              const execBtn = shadow.getElementById('execBtn');
              const statusText = shadow.getElementById('statusText');

              execBtn.addEventListener('click', async () => {
                const startTime = performance.now();
                statusText.innerText = "Streaming buffer & verifikasi...";

                let count = 0;
                const stream = new ReadableStream({
                  start(controller) {
                    function push() {
                      if (count < multiplier) {
                        controller.enqueue(new Uint8Array(buffer));
                        count++;
                        push();
                      } else {
                        controller.close();
                      }
                    }
                    push();
                  }
                });

                const blob = await new Response(stream).blob();
                const blobUrl = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = "tested_" + filename;
                link.click();

                // Pembersihan memori instan
                setTimeout(() => URL.revokeObjectURL(blobUrl), 100);

                const durationSec = ((performance.now() - startTime) / 1000).toFixed(2);
                const speedMBps = ((totalSize / (1024 * 1024)) / durationSec).toFixed(2);

                statusText.innerText = \`Sukses! Waktu: \${durationSec}s (\${speedMBps} MB/s)\`;

                window.parent.postMessage({
                  type: 'DONE',
                  duration: durationSec,
                  speed: speedMBps,
                  hash: origHash,
                  isStrict: isStrict
                }, '*');
              });
            }
          <\/script>
        </body>
        </html>
      `;

      iframe.srcdoc = sandboxedHTML;

      iframe.onload = () => {
        iframe.contentWindow.postMessage({
          type: 'MOUNT',
          buffer: arrayBuffer,
          name: file.name,
          multiplier: multiplier,
          totalSize: totalBytes,
          isStrict: isStrict,
          origHash: fileHash
        }, '*');

        metrics.innerHTML = `✅ <b>Lapisan Siap:</b> File terisolasi di Iframe Sandbox + Closed Shadow DOM.<br>` +
          (isStrict ? `🔐 <b>SHA-256 Asal:</b> <span style="font-size:11px; color:#a7f3d0;">${fileHash}</span>` : `🛡️ Mode Standar aktif.`);
      };
    });

    window.addEventListener('message', (e) => {
      if (e.data.type === 'DONE') {
        metrics.innerHTML = `🏁 <b>Hasil Pengujian:</b><br>` +
          `• Waktu Proses: <b>${e.data.duration} detik</b><br>` +
          `• Throughput Memori: <b>${e.data.speed} MB/s</b><br>` +
          `• Mode Keamanan: <b>${e.data.isStrict ? 'Super Ketat (CSP + Hash Validated)' : 'Standar'}</b>`;
      }
    });
  </script>
</body>
</html>
